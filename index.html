<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LowPoly Редактор</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Top Toolbar -->
    <div id="toolbar">
      <div class="toolbar-group">
        <button id="btn-cube" class="toolbar-btn" title="Куб">Куб</button>
        <button id="btn-sphere" class="toolbar-btn" title="Сфера">Сфера</button>
        <button id="btn-cylinder" class="toolbar-btn" title="Цилиндр">Цилиндр</button>
        <button id="btn-plane" class="toolbar-btn" title="Плоскость">Плоскость</button>
        <button id="btn-cone" class="toolbar-btn" title="Конус">Конус</button>
      </div>
      <div class="toolbar-group">
        <label class="toolbar-label">Количество полигонов:
          <input type="range" id="detail-slider" min="1" max="64" value="4" />
          <span id="detail-value">4</span>
        </label>
      </div>
      <div class="toolbar-group mode-group" id="toolbar-modes">
        <button class="mode-btn active" data-mode="object">Объект</button>
        <button class="mode-btn" data-mode="vertex">Вершины</button>
        <button class="mode-btn" data-mode="edge">Рёбра</button>
        <button class="mode-btn" data-mode="face">Грани</button>
        <button class="mode-btn" data-mode="weightpaint">Веса</button>
        <button class="mode-btn" data-mode="sculpt">Скульптинг</button>
      </div>
      <div class="toolbar-group">
        <button id="btn-undo" class="toolbar-btn" title="Отменить">Отменить</button>
        <button id="btn-redo" class="toolbar-btn" title="Повторить">Повторить</button>
      </div>
      <div class="toolbar-group">
        <button id="btn-grid-snap" class="toolbar-btn toggle-btn" title="Привязка к сетке">Сетка</button>
        <button id="btn-shading" class="toolbar-btn toggle-btn" title="Переключить затенение">Плоское</button>
      </div>
      <div class="toolbar-group mirror-group" id="toolbar-mirror">
        <button id="btn-mirror" class="toolbar-btn toggle-btn" title="Зеркальное отражение">Зеркало</button>
        <button id="btn-mirror-x" class="toolbar-btn mirror-axis-btn active" title="Ось X">X</button>
        <button id="btn-mirror-y" class="toolbar-btn mirror-axis-btn" title="Ось Y">Y</button>
        <button id="btn-mirror-z" class="toolbar-btn mirror-axis-btn" title="Ось Z">Z</button>
        <button id="btn-mirror-apply" class="toolbar-btn" title="Применить зеркало">Применить</button>
      </div>
      <div class="toolbar-group" id="toolbar-subdivide">
        <button id="btn-subdivide" class="toolbar-btn" title="Подразделить меш">Подразделить</button>
        <button id="btn-decimate" class="toolbar-btn" title="Упростить меш">Упростить</button>
      </div>
      <div class="toolbar-group" id="toolbar-booleans">
        <button id="btn-bool-union" class="toolbar-btn" title="Объединить два меша">Объединить</button>
        <button id="btn-bool-subtract" class="toolbar-btn" title="Вычесть второй из первого">Вычесть</button>
        <button id="btn-bool-intersect" class="toolbar-btn" title="Пересечение двух мешей">Пересечь</button>
      </div>
      <div class="toolbar-group">
        <button id="btn-templates" class="toolbar-btn" title="Шаблоны моделей">Шаблоны</button>
      </div>
      <div class="toolbar-group">
        <button id="btn-import" class="toolbar-btn" title="Импорт модели">Импорт</button>
        <button id="btn-export-glb" class="toolbar-btn" title="Экспорт GLB">Экспорт GLB</button>
        <button id="btn-export-obj" class="toolbar-btn" title="Экспорт OBJ">Экспорт OBJ</button>
      </div>
      <div class="toolbar-group">
        <button id="btn-theme" class="toolbar-btn toggle-btn" title="Переключить тему">Тема</button>
      </div>
      <div class="toolbar-group camera-group">
        <button id="btn-cam-front" class="toolbar-btn" title="Вид спереди">Перед</button>
        <button id="btn-cam-back" class="toolbar-btn" title="Вид сзади">Зад</button>
        <button id="btn-cam-left" class="toolbar-btn" title="Вид слева">Лево</button>
        <button id="btn-cam-right" class="toolbar-btn" title="Вид справа">Право</button>
        <button id="btn-cam-top" class="toolbar-btn" title="Вид сверху">Верх</button>
        <button id="btn-cam-bottom" class="toolbar-btn" title="Вид снизу">Низ</button>
        <button id="btn-cam-save" class="toolbar-btn" title="Сохранить камеру">Сохранить камеру</button>
        <button id="btn-cam-load" class="toolbar-btn" title="Загрузить камеру">Загрузить камеру</button>
      </div>
      <div class="toolbar-group">
        <button id="btn-quick-actions-toggle" class="toolbar-btn toggle-btn active" title="Быстрые действия">Быстрые</button>
      </div>
      <div class="toolbar-group">
        <button id="btn-screenshot" class="toolbar-btn" title="Сделать снимок">Снимок</button>
      </div>
      <div class="toolbar-group">
        <button id="btn-tutorial-help" class="toolbar-btn" title="Обучение">?</button>
      </div>
      <div class="toolbar-group">
        <button id="btn-timeline-toggle" class="toolbar-btn toggle-btn" title="Показать/скрыть таймлайн">Таймлайн</button>
      </div>
      <div class="toolbar-group" id="toolbar-bones">
        <button id="btn-add-bone" class="toolbar-btn" title="Добавить кость">Добавить кость</button>
        <button id="btn-remove-bone" class="toolbar-btn" title="Удалить кость">Удалить кость</button>
      </div>
    </div>

    <!-- Left Tool Panel -->
    <div id="tool-panel">
      <h3 class="panel-title">Инструменты</h3>
      <button class="tool-btn active" data-tool="select">Выделение</button>
      <button class="tool-btn" data-tool="move">Перемещение</button>
      <button class="tool-btn" data-tool="rotate">Вращение</button>
      <button class="tool-btn" data-tool="scale">Масштаб</button>
      <button class="tool-btn" data-tool="extrude">Экструзия</button>
      <hr class="tool-separator" />
      <button class="tool-btn" data-tool="duplicate">Дублировать</button>
      <button class="tool-btn" data-tool="delete">Удалить</button>
      <button class="tool-btn" data-tool="paint">Покраска</button>
      <hr class="tool-separator" />
      <button class="tool-btn" id="btn-loopcut" data-tool="loopcut">Петлевой разрез</button>
      <button class="tool-btn" id="btn-merge-vertices" data-tool="merge">Объединить вершины</button>
      <hr class="tool-separator" />
      <h3 class="panel-title">Библиотека</h3>
      <button class="tool-btn" id="btn-lib-tree">Дерево</button>
      <button class="tool-btn" id="btn-lib-rock">Камень</button>
      <button class="tool-btn" id="btn-lib-house">Дом</button>
      <button class="tool-btn" id="btn-lib-character">Персонаж</button>
      <button class="tool-btn" id="btn-lib-sword">Меч</button>
      <button class="tool-btn" id="btn-lib-shield">Щит</button>
    </div>

    <!-- Viewport -->
    <div id="viewport"></div>

    <!-- Right Properties Panel -->
    <div id="properties-panel">
      <h3 class="panel-title">Объекты сцены</h3>
      <div id="outliner-list"></div>
      <h3 class="panel-title">Свойства объекта</h3>
      <div id="properties-content">
        <div class="property-group">
          <label class="property-label">Позиция</label>
          <div class="property-row">
            <label>X <input type="number" id="pos-x" step="0.1" value="0" /></label>
            <label>Y <input type="number" id="pos-y" step="0.1" value="0" /></label>
            <label>Z <input type="number" id="pos-z" step="0.1" value="0" /></label>
          </div>
        </div>
        <div class="property-group">
          <label class="property-label">Вращение</label>
          <div class="property-row">
            <label>X <input type="number" id="rot-x" step="1" value="0" /></label>
            <label>Y <input type="number" id="rot-y" step="1" value="0" /></label>
            <label>Z <input type="number" id="rot-z" step="1" value="0" /></label>
          </div>
        </div>
        <div class="property-group">
          <label class="property-label">Масштаб</label>
          <div class="property-row">
            <label>X <input type="number" id="scale-x" step="0.1" value="1" /></label>
            <label>Y <input type="number" id="scale-y" step="0.1" value="1" /></label>
            <label>Z <input type="number" id="scale-z" step="0.1" value="1" /></label>
          </div>
        </div>
      </div>
      <h3 class="panel-title">Палитра цветов</h3>
      <div id="color-palette">
        <input type="color" id="object-color" value="#4a90d9" />
      </div>
      <div id="lights-section"></div>
      <div id="skybox-section"></div>
    </div>

    <!-- Bottom Status Bar -->
    <div id="timeline-panel">
      <div class="timeline-controls">
        <button id="btn-timeline-play" class="toolbar-btn" title="Воспроизвести">Воспроизвести</button>
        <button id="btn-timeline-pause" class="toolbar-btn" title="Пауза">Пауза</button>
        <button id="btn-timeline-stop" class="toolbar-btn" title="Стоп">Стоп</button>
        <label class="timeline-label">Кадр:
          <input type="number" id="timeline-frame" value="0" min="0" class="timeline-input" />
        </label>
        <label class="timeline-label">Всего:
          <input type="number" id="timeline-total-frames" value="120" min="1" class="timeline-input" />
        </label>
        <label class="timeline-label">FPS:
          <select id="timeline-fps" class="timeline-select">
            <option value="12">12</option>
            <option value="24" selected>24</option>
            <option value="30">30</option>
            <option value="60">60</option>
          </select>
        </label>
        <button id="btn-add-keyframe" class="toolbar-btn" title="Добавить ключевой кадр">Добавить кадр</button>
        <span class="timeline-separator">|</span>
        <button id="btn-preset-idle" class="toolbar-btn" title="Пресет: Покой">Покой</button>
        <button id="btn-preset-walk" class="toolbar-btn" title="Пресет: Ходьба">Ходьба</button>
        <button id="btn-preset-attack" class="toolbar-btn" title="Пресет: Атака">Атака</button>
      </div>
      <div id="timeline-bar" class="timeline-bar"></div>
    </div>

    <div id="status-bar">
      <span id="vertex-count">Вершины: 0</span>
      <span class="status-separator">|</span>
      <span id="face-count">Грани: 0</span>
      <span class="status-separator">|</span>
      <span id="mode-display">Режим: Объект</span>
      <span class="status-separator">|</span>
      <span id="selection-count"></span>
    </div>
  </div>

  <input type="file" id="file-import" accept=".obj,.glb,.gltf" style="display:none" />
  <input type="file" id="file-project" accept=".json" style="display:none" />
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
